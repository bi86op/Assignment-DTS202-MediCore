apiVersion: apps/v1
kind: Deployment
metadata:
  name: medicore-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medicore
  template:
    metadata:
      labels:
        app: medicore
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: medicore-app
          image: medicore-app:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10